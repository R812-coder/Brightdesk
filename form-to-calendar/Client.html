<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // STATE
  // ---------------------------------------------------------------------------
  var S = {
    st: null,          // server state from getState()
    cfg: null,         // working copy of the configuration
    view: 'loading',
    cals: null,        // writable calendars
    preview: null,     // live preview result
    test: null,        // "Test with latest response" result
    reqs: null,        // pending requests
    reqUi: {},         // per-request UI state { declining, reason, conflict, busy }
    back: null,        // view to return to from Upgrade
    flash: null,       // one-time message { kind, text }
    errors: [],        // inline errors for the current step
    billing: 'year',
    keyMsg: null,
    upMsg: null,
    replace: false,
    calFilter: '',
    busy: false
  };
  var app = document.getElementById('app');
  var INITIAL = document.body.getAttribute('data-view') || '';

  var DEFAULT_CONFIRM = {
    subject: 'Booked: {{Event title}}',
    body: 'Hello,\n\nYour request is booked for {{Event time}}.\n\n{{Event title}}\n\nIf your email address was included, a calendar invitation is on its way too.'
  };
  var DEFAULT_DECLINE = {
    subject: 'We couldn\'t book your request',
    body: 'Hello,\n\nWe couldn\'t book your request for {{Event time}}.\n\nReason: {{Reason}}\n\nPlease submit the form again with a different time.'
  };
  var DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  var I = {
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>',
    alert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8l6.6 11.6H1.4z"/><path d="M8 6.4v3.2"/><path d="M8 11.7v.1"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.3"/><path d="M8 7.3v4"/><path d="M8 4.8v.1"/></svg>',
    back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>',
    refresh: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 8.6A5.5 5.5 0 1 1 11.8 4"/><path d="M13.5 1.8v3.4h-3.4"/></svg>',
    list: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.1M2.5 8h.1M2.5 12h.1"/></svg>',
    power: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1.8v6"/><path d="M4.6 4.1a5 5 0 1 0 6.8 0"/></svg>',
    edit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10.6 2.4l3 3L6 13H3v-3z"/></svg>',
    test: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h4M7 2v4.2L3.2 12.6A1 1 0 0 0 4 14h8a1 1 0 0 0 .8-1.4L9 6.2V2"/></svg>',
    inbox: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 9l1.8-6h8.4L14 9v4H2z"/><path d="M2 9h3.5l1 1.6h3L10.5 9H14"/></svg>',
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
    x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>'
  };

  // ---------------------------------------------------------------------------
  // HELPERS
  // ---------------------------------------------------------------------------
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function copy(o) { return JSON.parse(JSON.stringify(o)); }
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[name].apply(r, args);
    });
  }
  function errText(e) { return String((e && e.message) || e || 'Something went wrong.').replace(/^Exception:\s*/, ''); }
  function isPro() { return S.st && S.st.plan && S.st.plan.plan !== 'free'; }
  function qs(types) { return (S.st.questions || []).filter(function (q) { return types.indexOf(q.type) >= 0; }); }
  function q(id) { return (S.st.questions || []).filter(function (x) { return String(x.id) === String(id); })[0] || null; }
  function getPath(o, path) { return path.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function setPath(o, path, v) {
    var ks = path.split('.'), last = ks.pop();
    var t = ks.reduce(function (a, k) { if (a[k] == null) a[k] = {}; return a[k]; }, o);
    t[last] = v;
  }
  function toast(text) {
    var t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }
  function options(list, selected, placeholder) {
    var h = placeholder !== undefined ? '<option value="">' + esc(placeholder) + '</option>' : '';
    list.forEach(function (o) {
      var v = o.value !== undefined ? o.value : o.id;
      var l = o.label !== undefined ? o.label : o.title;
      h += '<option value="' + esc(v) + '"' + (String(v) === String(selected) ? ' selected' : '') + '>' + esc(l) + '</option>';
    });
    return h;
  }
  function insertMenu(target) {
    var list = (S.st.questions || []).map(function (x) { return { value: x.title, label: x.title }; });
    if (S.st.form.collectsEmail) list.push({ value: 'Respondent email', label: 'Respondent email' });
    list.push({ value: 'Form title', label: 'Form title' });
    return '<select class="ins" data-insert="' + target + '" aria-label="Insert answer">' + options(list, '', 'Insert answer') + '</select>';
  }
  function proTag() { return '<span class="pro" title="Pro feature">Pro</span>'; }
  function notice(kind, html, extra) {
    var icon = kind === 'ok' ? I.check : kind === 'info' ? I.info : I.alert;
    return '<div class="notice ' + kind + '" role="' + (kind === 'err' ? 'alert' : 'status') + '">' + icon + '<div class="body">' + html + (extra || '') + '</div></div>';
  }
  function field(label, inner, help, extraLabel) {
    return '<div class="field"><div class="label">' + label + (extraLabel || '') + '</div>' + inner + (help ? '<div class="help">' + help + '</div>' : '') + '</div>';
  }
  function sw(key, on, label, help) {
    return '<div class="head"><label class="switch"><input type="checkbox" data-act="pro" data-key="' + key + '"' + (on ? ' checked' : '') +
      ' aria-label="' + esc(label) + '"><span></span></label><div class="txt"><h3>' + esc(label) + ' ' + proTag() + '</h3>' +
      (help ? '<div class="help" style="margin-top:0">' + help + '</div>' : '') + '</div></div>';
  }
  function calName(id) {
    var c = (S.cals || []).filter(function (x) { return x.id === id; })[0];
    return c ? c.name : (id === S.cfg.calendarId ? S.cfg.calendarName : id);
  }
  function ymdPretty(ymd) {
    if (!ymd) return '';
    var p = ymd.split('-').map(Number);
    var mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return p[2] + ' ' + mon[p[1] - 1] + ' ' + p[0];
  }

  // ---------------------------------------------------------------------------
  // LAYOUT
  // ---------------------------------------------------------------------------
  function render() {
    var v = VIEWS[S.view] ? VIEWS[S.view]() : VIEWS.loading();
    var scrollTop = (app.querySelector('.scroll') || {}).scrollTop || 0;
    app.innerHTML = '<div class="scroll" id="scroll">' + v.body + '</div>' +
      (v.bar ? '<div class="bar' + (v.stack ? ' stack' : '') + '">' + v.bar + '</div>' : '') +
      '<div class="foot"><a href="#" data-act="help">Help</a><span aria-hidden="true">&middot;</span>' +
      '<a href="' + esc((S.st && S.st.links.services) || 'https://brightdesk.dev/services/') + '" target="_blank" rel="noopener">Need something custom built?</a></div>';
    var sc = app.querySelector('.scroll');
    if (sc && v.keepScroll) sc.scrollTop = scrollTop;
    if (v.after) v.after();
  }

  function go(view, keepFlash) {
    S.view = view;
    S.errors = [];
    if (!keepFlash) S.flash = null;
    render();
    var sc = app.querySelector('.scroll'); if (sc) sc.scrollTop = 0;
    if (view === 'step1' && !S.cals) loadCalendars();
    if (view === 'step2') schedulePreview(0);
    if (view === 'requests') loadRequests();
  }

  function stepHead(n, title) {
    return '<div class="eyebrow">Step ' + n + ' of 3</div><h1>' + esc(title) + '</h1>';
  }

  // ---------------------------------------------------------------------------
  // VIEWS
  // ---------------------------------------------------------------------------
  var VIEWS = {};

  VIEWS.loading = function () {
    return { body: '<div class="center"><span class="spinner"></span><div style="margin-top:10px">Loading</div></div>' };
  };

  VIEWS.error = function () {
    return { body: notice('err', '<b>Could not load.</b> ' + esc(S.loadError || '')),
      bar: '<button class="btn primary" data-act="reload">' + I.refresh + 'Try again</button>' };
  };

  VIEWS.welcome = function () {
    var hasDate = qs(['DATE', 'DATETIME']).length > 0;
    var body = '<h1>Turn every response into a calendar event.</h1>' +
      '<ol class="steps"><li>Pick a calendar.</li><li>Match your questions to the event.</li>' +
      '<li>Turn it on. Each new response adds an event, at the right time.</li></ol>' +
      (!hasDate ? notice('info', 'This form has no date question yet. <b>Add booking questions for me</b> adds a date, start time, duration and your respondents\' email addresses.') : '') +
      (S.flash ? notice(S.flash.kind, esc(S.flash.text)) : '');
    var bar = '<button class="btn primary" data-act="start">Set up this form</button>' +
      '<button class="btn" data-act="addQuestions">Add booking questions for me</button>';
    return { body: body, bar: bar, stack: true };
  };

  VIEWS.step1 = function () {
    var body = stepHead(1, 'Calendar');
    body += '<p class="muted">Times are booked in this calendar\'s time zone.</p>';
    if (!S.cals) {
      body += '<div class="center"><span class="spinner"></span><div style="margin-top:8px">Loading your calendars</div></div>';
    } else if (!S.cals.length) {
      body += notice('warn', 'You have no calendars you can add events to.');
    } else {
      if (S.cals.length > 8) {
        body += '<div class="field"><input type="text" id="calFilter" placeholder="Find a calendar" value="' + esc(S.calFilter) + '" aria-label="Find a calendar"></div>';
      }
      var f = S.calFilter.toLowerCase();
      S.cals.filter(function (c) { return !f || c.name.toLowerCase().indexOf(f) >= 0; }).forEach(function (c) {
        var on = c.id === S.cfg.calendarId;
        body += '<label class="radio' + (on ? ' on' : '') + '"><input type="radio" name="cal" data-act="pickCal" value="' + esc(c.id) + '"' + (on ? ' checked' : '') + '>' +
          '<div><div>' + esc(c.name) + (c.primary ? ' <span class="muted small">(your main calendar)</span>' : '') + '</div><div class="tz">' + esc(c.tz) + '</div></div></label>';
      });
    }
    body += errorsHtml();
    var bar = '<button class="btn" data-act="back1">' + I.back + 'Back</button><button class="btn primary" data-act="next1"' + (S.cfg.calendarId ? '' : ' disabled') + '>Next</button>';
    return { body: body, bar: bar };
  };

  VIEWS.step2 = function () {
    var c = S.cfg, body = stepHead(2, 'Map your questions');
    var slots = isPro() && c.pro.slots;

    // Title
    body += field('Event title', '<input type="text" id="f-title" data-bind="title" value="' + esc(c.title) + '" placeholder="Room booking: {{Your name}}">' + insertMenu('f-title'),
      'Type text and insert answers. Example: {{Your name}}: {{Room}}');

    // Date
    if (slots) {
      var sq = q(c.pro.slots.itemId);
      body += field('Date and time', '<div class="card soft">Comes from the bookable time slots question' + (sq ? ' <b>' + esc(sq.title) + '</b>' : '') + '. Change it in Step 3.</div>');
    } else {
      var dateQs = qs(['DATE', 'DATETIME']);
      var dq = q(c.startDate.itemId);
      var dateField = dateQs.length
        ? '<select data-bind="startDate.itemId" data-kind="id" data-rerender="1">' + options(dateQs, c.startDate.itemId, 'Choose a question') + '</select>'
        : notice('warn', 'This form has no date question. Add one in the form, or go back and use Add booking questions for me.');
      if (dq && dq.includesYear === false) {
        dateField += notice('err', 'The question \'' + esc(dq.title) + '\' doesn\'t include the year. Turn on \'Include year\' so events land in the right year.',
          '<div style="margin-top:6px"><button class="btn sm" data-act="fixYear" data-id="' + dq.id + '">Fix it</button></div>');
      }
      body += field('Date', dateField);

      // Start time
      var isDT = dq && dq.type === 'DATETIME';
      if (isDT) {
        body += field('Start time', '<div class="card soft">Comes from <b>' + esc(dq.title) + '</b>.</div>');
      } else if (c.end.mode === 'endDate') {
        body += field('Start time', '<div class="card soft">End-date events are all-day.</div>');
      } else {
        body += field('Start time', '<select data-bind="startTime.itemId" data-kind="id">' + options(qs(['TIME']), c.startTime.itemId, 'All-day event') + '</select>',
          'If the person leaves the time blank, the event is all-day.');
      }

      // Ends
      var modes = [{ value: 'fixed', label: 'Fixed length' }, { value: 'duration', label: 'Duration question' }, { value: 'endTime', label: 'End time question' }];
      if (!isDT) modes.push({ value: 'endDate', label: 'End date question (multi-day)' });
      var endsInner = '<select data-bind="end.mode" data-rerender="1" aria-label="How the event ends">' + options(modes, c.end.mode) + '</select>';
      if (c.end.mode === 'fixed') {
        endsInner += '<div class="row" style="margin-top:6px"><input type="number" min="1" step="5" data-bind="end.minutes" data-kind="num" value="' + esc(c.end.minutes) + '" aria-label="Minutes"><span class="shrink muted">minutes</span></div>';
      } else {
        var endTypes = c.end.mode === 'duration' ? ['DURATION'] : c.end.mode === 'endTime' ? (isDT ? ['DATETIME', 'TIME'] : ['TIME', 'DATETIME']) : ['DATE'];
        var endQs = qs(endTypes).filter(function (x) { return String(x.id) !== String(c.startDate.itemId); });
        endsInner += '<div style="margin-top:6px">' + (endQs.length ? '<select data-bind="end.itemId" data-kind="id" data-rerender="1">' + options(endQs, c.end.itemId, 'Choose a question') + '</select>'
          : notice('warn', 'This form has no ' + (c.end.mode === 'duration' ? 'duration' : c.end.mode === 'endTime' ? 'time' : 'date') + ' question for this. Add one in the form, or pick Fixed length.')) + '</div>';
        if (c.end.mode !== 'endDate') {
          endsInner += '<div class="help">If it\'s left blank, the event lasts <input type="number" min="1" step="5" style="width:64px;min-height:24px;padding:2px 4px" data-bind="end.minutes" data-kind="num" value="' + esc(c.end.minutes) + '" aria-label="Fallback minutes"> minutes.</div>';
        }
        var eq = q(c.end.itemId);
        if (eq && eq.includesYear === false) {
          endsInner += notice('err', 'The question \'' + esc(eq.title) + '\' doesn\'t include the year.', '<div style="margin-top:6px"><button class="btn sm" data-act="fixYear" data-id="' + eq.id + '">Fix it</button></div>');
        }
      }
      body += field('Ends', endsInner);
    }

    // Location, description
    body += field('Location', '<input type="text" id="f-location" data-bind="location" value="' + esc(c.location) + '" placeholder="Optional">' + insertMenu('f-location'));
    body += field('Description', '<textarea id="f-description" data-bind="description" placeholder="Optional">' + esc(c.description) + '</textarea>' + insertMenu('f-description'));

    // Guests
    var textQs = qs(['TEXT']);
    var collects = S.st.form.collectsEmail;
    if (!collects && !textQs.length) {
      body += field('Guests', notice('info', 'This form doesn\'t collect email addresses, so we can\'t invite the person who responded. Turn on email collection in Settings, Responses.'));
    } else {
      var gOn = c.guests.source !== 'none';
      var gInner = '<label class="check"><input type="checkbox" data-act="guestsToggle"' + (gOn ? ' checked' : '') + '><span>Invite the person who responded</span></label>';
      if (gOn) {
        var srcOpts = [];
        if (collects) srcOpts.push({ value: 'respondent', label: 'The email address the form collects' });
        textQs.forEach(function (x) { srcOpts.push({ value: 'item:' + x.id, label: 'Answer to \'' + x.title + '\'' }); });
        var cur = c.guests.source === 'item' ? 'item:' + c.guests.itemId : c.guests.source;
        gInner += '<select style="margin-top:6px" data-act="guestSource" aria-label="Guest email source">' + options(srcOpts, cur) + '</select>';
        if (c.guests.source === 'respondent' && !collects) {
          gInner += notice('warn', 'This form doesn\'t collect email addresses, so we can\'t invite the person who responded. Turn on email collection in Settings, Responses.');
        }
      }
      body += field('Guests', gInner, gOn ? 'Google Calendar sends them the invitation.' : '');
    }

    body += '<div class="label" style="margin-top:4px">Preview</div><div id="preview">' + previewHtml() + '</div>';
    body += errorsHtml();
    var bar = '<button class="btn" data-act="go" data-to="step1">' + I.back + 'Back</button><button class="btn primary" data-act="next2">Next</button>';
    return { body: body, bar: bar, keepScroll: true };
  };

  function previewHtml() {
    var p = S.preview;
    if (!p) return '<div class="card soft muted"><span class="spinner"></span> Building a preview</div>';
    if (!p.ok) return notice('warn', esc(p.msg || 'Could not build a preview.'));
    return '<div class="card preview"><div class="t">' + esc(p.title) + '</div>' +
      '<div>' + esc(p.when) + '</div>' +
      '<div class="muted small">' + esc(p.calendar) + (p.location ? ' &middot; ' + esc(p.location) : '') + '</div>' +
      (p.guests && p.guests.length ? '<div class="small">Invite ' + esc(p.guests.join(', ')) + '</div>' : '') +
      '<div class="help">' + (p.source === 'latest' ? 'From the latest response' + (p.respondent ? ' (' + esc(p.respondent) + ')' : '') : 'Sample values: no responses yet') + '</div></div>';
  }

  VIEWS.step3 = function () {
    var c = S.cfg, p = c.pro, body = stepHead(3, 'Options');
    // Free options
    body += '<div class="card">';
    body += field('Event color', '<select data-bind="colorId" data-kind="str">' + options(S.st.colors.map(function (x) { return { value: x.id, label: x.name }; }), c.colorId || '', 'Calendar default') + '</select>');
    body += '<label class="check"><input type="checkbox" data-bind="guests.addOwner" data-kind="bool"' + (c.guests.addOwner ? ' checked' : '') + '><span>Also add me as a guest</span></label>';
    body += '<div class="help">Useful when events go to a shared calendar.</div>';
    body += '</div>';

    body += '<div class="eyebrow" style="margin-top:16px">Pro options</div>';
    if (!isPro()) body += '<p class="muted small">Available on Pro. Switching one on shows the plans.</p>';
    body += '<div class="card">';

    // Conflicts
    body += '<div class="opt">' + sw('conflict', p.conflict.on, 'Check for conflicts', 'Stop double bookings of rooms, people and equipment.');
    if (p.conflict.on) {
      body += '<div class="sub">' + field('When the time is taken', '<select data-bind="pro.conflict.action">' + options([
        { value: 'decline', label: 'Decline and email the person' },
        { value: 'approval', label: 'Send to approval with a warning' },
        { value: 'flag', label: 'Add it with "Conflict:" in the title' }], p.conflict.action) + '</select>') + '</div>';
    }
    body += '</div>';

    // Approval
    body += '<div class="opt">' + sw('approval', p.approval.on, 'Require approval', 'Requests wait for you to approve or decline before they reach the calendar.');
    if (p.approval.on) {
      var extra = (p.approval.notify || []).filter(function (e) { return e !== 'owner'; }).join(', ');
      body += '<div class="sub">' + field('Also email these approvers', '<input type="text" data-bind="pro.approval.notify" data-kind="notify" value="' + esc(extra) + '" placeholder="name@example.com, another@example.com">',
        'You are always notified. Approvers must be editors of this form.') + '</div>';
    }
    body += '</div>';

    // Slots
    body += '<div class="opt">' + sw('slots', !!p.slots, 'Bookable time slots', 'Your form shows only open times. Taken times disappear after each response.');
    if (p.slots) {
      var s = p.slots, choiceQs = qs(['MULTIPLE_CHOICE', 'LIST']);
      var sub = '';
      if (!choiceQs.length) {
        sub += notice('info', 'Slots go into a multiple-choice or dropdown question.', '<div style="margin-top:6px"><button class="btn sm" data-act="addSlotQ">Add a time slot question for me</button></div>');
      } else {
        sub += field('Question that shows the times', '<select data-bind="pro.slots.itemId" data-kind="id" data-rerender="1">' + options(choiceQs, s.itemId, 'Choose a question') + '</select>',
          'Its choices are replaced with open times like "Tue 17 Nov 2026, 10:00–10:30".');
      }
      var days = '<div class="days">' + DAY_NAMES.map(function (d, i) {
        var on = s.weekdays.indexOf(i + 1) >= 0;
        return '<label><input type="checkbox" data-act="day" value="' + (i + 1) + '"' + (on ? ' checked' : '') + '>' + d + '</label>';
      }).join('') + '</div>';
      sub += field('Days', days);
      sub += field('Hours', '<div class="row"><input type="time" data-bind="pro.slots.from" value="' + esc(s.from) + '" aria-label="From"><span class="shrink muted">to</span><input type="time" data-bind="pro.slots.to" value="' + esc(s.to) + '" aria-label="To"></div>',
        'In the calendar\'s time zone' + (c.tz ? ' (' + esc(c.tz) + ')' : '') + '.');
      sub += '<div class="row">' +
        field('Slot length', '<div class="row"><input type="number" min="5" step="5" data-bind="pro.slots.minutes" data-kind="num" value="' + s.minutes + '"><span class="shrink muted">min</span></div>') +
        field('Gap between', '<div class="row"><input type="number" min="0" step="5" data-bind="pro.slots.bufferMinutes" data-kind="num" value="' + s.bufferMinutes + '"><span class="shrink muted">min</span></div>') + '</div>';
      sub += '<div class="row">' +
        field('Days ahead', '<input type="number" min="1" max="90" data-bind="pro.slots.daysAhead" data-kind="num" value="' + s.daysAhead + '">') +
        field('Notice (hours)', '<input type="number" min="0" data-bind="pro.slots.minNoticeHours" data-kind="num" value="' + s.minNoticeHours + '">') + '</div>';

  function checkStep2() {
    var c = S.cfg, errs = [];
    if (!String(c.title || '').trim()) errs.push({ msg: 'Give the event a title.' });
    if (!(isPro() && c.pro.slots)) {
      var dq = q(c.startDate.itemId);
      if (!dq) errs.push({ msg: 'Pick the question that holds the date.' });
      else if (dq.includesYear === false) errs.push({ msg: 'The question \'' + dq.title + '\' doesn\'t include the year. Turn on \'Include year\' so events land in the right year.', fix: { type: 'includeYear', itemId: dq.id } });
      if (c.end.mode !== 'fixed' && !q(c.end.itemId)) errs.push({ msg: 'Pick the question for when the event ends, or choose Fixed length.' });
      if (c.end.mode === 'fixed' && !(Number(c.end.minutes) > 0)) errs.push({ msg: 'Enter how many minutes the event lasts.' });
    }
    return errs;
  }
  function checkStep3() {
    var p = S.cfg.pro, errs = [];
    if (!isPro()) return errs;
    if (p.slots) {
      if (!q(p.slots.itemId)) errs.push({ msg: 'Pick the question that shows the time slots.' });
      if (!p.slots.weekdays.length) errs.push({ msg: 'Pick at least one day for time slots.' });
      if (p.slots.from >= p.slots.to) errs.push({ msg: 'Slot hours must end after they start.' });
    }
    p.routes.forEach(function (r, i) { if (!r.itemId || !r.calendarId || !String(r.equals).trim()) errs.push({ msg: 'Routing rule ' + (i + 1) + ' needs a question, an answer and a calendar.' }); });
    return errs;
  }

  function schedulePreview(delay) {
    clearTimeout(previewTimer);

      var seq = ++previewSeq;

        if (seq !== previewSeq) return;
        S.preview = p;

      }).catch(function (e) {
        S.preview = { ok: false, msg: errText(e) };

  function withBusy(btn, promise) {
    if (btn) { btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.innerHTML = '<span class="spinner" style="width:14px;height:14px"></span>'; }
    return promise.then(function (x) { return x; }, function (e) {
      if (btn) { btn.disabled = false; btn.innerHTML = btn.dataset.label; }
      throw e;
    });
  }

  // ---------------------------------------------------------------------------
  var A = {};
  A.reload = function () { S.view = 'loading'; render(); init(); };
  A.help = function (el, ev) { ev.preventDefault(); google.script.run.openHelpFromSidebar(); };
  A.log = function () { google.script.run.openLogFromSidebar(); };
  A.go = function (el) { go(el.getAttribute('data-to')); };
  A.start = function () { go('step1'); };
  A.back1 = function () { go(S.st.cfg ? 'dashboard' : 'welcome'); };
  A.addQuestions = function (el) {
    withBusy(el, call('addBookingQuestions')).then(function (st) {
      S.st = st; S.cfg = copy(st.defaults); S.cfg.calendarId = ''; S.cals = S.cals || null;
      S.flash = { kind: 'ok', text: 'Added Your name, Date, Start time and Duration, and turned on email collection.' };
      go('step1', true);
      toast('Booking questions added to the form.');
    }).catch(function (e) { toast(errText(e)); });
  };
  A.pickCal = function (el) {
    var c = S.cals.filter(function (x) { return x.id === el.value; })[0];
    if (!c) return;
    S.cfg.calendarId = c.id; S.cfg.calendarName = c.name; S.cfg.tz = c.tz;
    S.preview = null; render();
  };
  A.next1 = function () { if (!S.cfg.calendarId) return; go('step2'); };
  A.next2 = function () { S.errors = checkStep2(); if (S.errors.length) { render(); scrollBottom(); return; } go('step3'); };
  A.next3 = function () {
    S.errors = checkStep3(); if (S.errors.length) { render(); scrollBottom(); return; }
    S.test = null; S.warnings = (S.st.issues || []).filter(function (i) { return i.level === 'warn'; });
    go('review');
    if (!S.cals) loadCalendars();
  };
  A.fixYear = function (el) {
    withBusy(el, call('fixIncludeYear', el.getAttribute('data-id'))).then(function (r) {
      if (!r.ok) { toast(r.msg); return; }
      S.st = r.state; S.errors = []; toast('Include year is on.'); render(); schedulePreview(0);
    }).catch(function (e) { toast(errText(e)); });
  };
  A.guestsToggle = function (el) {
    if (el.checked) {
      if (S.st.form.collectsEmail) S.cfg.guests.source = 'respondent';
      else { var t = qs(['TEXT']).filter(function (x) { return /e-?mail/i.test(x.title); })[0] || qs(['TEXT'])[0]; S.cfg.guests.source = 'item'; S.cfg.guests.itemId = t ? t.id : null; }
    } else { S.cfg.guests.source = 'none'; }
    render(); schedulePreview();
  };
  A.guestSource = function (el) {
    var v = el.value;
    if (v === 'respondent') { S.cfg.guests.source = 'respondent'; S.cfg.guests.itemId = null; }
    else { S.cfg.guests.source = 'item'; S.cfg.guests.itemId = Number(v.split(':')[1]); }
    render(); schedulePreview();
  };
  A.pro = function (el) {
    var key = el.getAttribute('data-key');
    if (!isPro()) { S.back = 'step3'; S.upMsg = 'That option is part of Pro.'; go('upgrade'); return; }
    var p = S.cfg.pro, on = el.checked;
    if (key === 'conflict') p.conflict.on = on;
    if (key === 'approval') p.approval.on = on;
    if (key === 'updateOnEdit') p.updateOnEdit = on;
    if (key === 'meet') p.meet = on;
    if (key === 'slots') {
      var cq = qs(['MULTIPLE_CHOICE', 'LIST']).filter(function (x) { return /time|slot|when|appointment/i.test(x.title); })[0];
      p.slots = on ? { itemId: cq ? cq.id : null, weekdays: [1, 2, 3, 4, 5], from: '09:00', to: '17:00', minutes: 30, bufferMinutes: 0, daysAhead: 14, minNoticeHours: 12, capacity: 1 } : null;
    }
    if (key === 'routes') { p.routes = on ? [{ itemId: null, equals: '', calendarId: '', colorId: null }] : []; if (on && !S.cals) loadCalendars(); }
    if (key === 'reminders') p.reminders = on ? [{ method: 'popup', minutes: 30 }] : [];
    if (key === 'emails') p.emails = on ? { confirm: { on: true, subject: DEFAULT_CONFIRM.subject, body: DEFAULT_CONFIRM.body }, decline: { on: true, subject: DEFAULT_DECLINE.subject, body: DEFAULT_DECLINE.body } } : { confirm: null, decline: null };
    render();
  };
  A.day = function (el) {
    var d = Number(el.value), w = S.cfg.pro.slots.weekdays;
    if (el.checked && w.indexOf(d) < 0) w.push(d);
    if (!el.checked) S.cfg.pro.slots.weekdays = w.filter(function (x) { return x !== d; });
    S.cfg.pro.slots.weekdays.sort();
  };
  A.addSlotQ = function (el) {
    withBusy(el, call('addSlotQuestion')).then(function (r) { S.st = r.state; S.cfg.pro.slots.itemId = r.itemId; render(); toast('Added the question "Choose a time".'); })
      .catch(function (e) { toast(errText(e)); });
  };
  A.addRoute = function () { S.cfg.pro.routes.push({ itemId: null, equals: '', calendarId: '', colorId: null }); render(); };
  A.delRoute = function (el) { S.cfg.pro.routes.splice(Number(el.getAttribute('data-i')), 1); render(); };
  A.routeCal = function () { /* handled by data-bind; name filled on save */ };
  A.addReminder = function () { S.cfg.pro.reminders.push({ method: 'popup', minutes: 10 }); render(); };
  A.delReminder = function (el) { S.cfg.pro.reminders.splice(Number(el.getAttribute('data-i')), 1); render(); };

  A.test = function (el) {
    withBusy(el, call('previewEvent', S.cfg, true)).then(function (r) { S.test = r; render(); scrollBottom(); })
      .catch(function (e) { S.test = { ok: false, msg: errText(e) }; render(); });
  };
  A.takeOver = function () { S.replace = true; render(); };
  A.turnOn = function (el) {
    var st = S.st;
    var turnOn = !(st.active && st.ownerIsMe) && !(st.active && st.owner && !st.ownerIsMe && !S.replace);
    (S.cfg.pro.routes || []).forEach(function (r) { r.calendarName = calName(r.calendarId); });
    withBusy(el, call('saveSetup', S.cfg, { turnOn: turnOn, replace: S.replace })).then(function (r) {
      if (r.ok) {
        S.st = r.state; S.cfg = copy(r.state.cfg); S.replace = false;
        S.flash = { kind: 'ok', text: turnOn ? 'On. Running as ' + r.state.me + '.' : 'Changes saved.' };
        if (r.slots) S.flash.text += ' ' + r.slots.count + ' time slots are on the form.';
        go('dashboard', true);
        return;
      }
      if (r.needReplace) { S.replace = true; S.errors = []; render(); return; }
      if (r.freeLimit || r.needPro) { S.back = 'review'; S.upMsg = r.msg; go('upgrade'); return; }
      S.errors = r.issues || [{ msg: r.msg || 'Could not save.' }];
      render(); scrollBottom();
    }).catch(function (e) { S.errors = [{ msg: errText(e) }]; render(); scrollBottom(); });
  };
  A.edit = function () { S.cfg = copy(S.st.cfg || S.st.defaults); S.preview = null; go('step1'); };
  A.reviewOn = function () { S.cfg = copy(S.st.cfg); S.test = null; S.warnings = []; go('review'); if (!S.cals) loadCalendars(); };
  A.turnOff = function (el) {
    withBusy(el, call('turnOff')).then(function (st) { S.st = st; S.flash = { kind: 'info', text: 'Off. New responses are not added to the calendar.' }; go('dashboard', true); })
      .catch(function (e) { toast(errText(e)); });
  };
  A.retry = function (el) {
    withBusy(el, call('retryNow')).then(function (r) {
      if (!r.ok) { toast(r.msg); render(); return; }
      S.st = r.state;
      S.flash = { kind: r.fixed ? 'ok' : 'warn', text: r.tried ? r.fixed + ' of ' + r.tried + ' added.' : 'Nothing to retry.' };
      go('dashboard', true);
    }).catch(function (e) { toast(errText(e)); render(); });
  };
  A.processMissed = function (el) {
    withBusy(el, call('processMissed')).then(function (r) {
      if (!r.ok) { toast(r.msg); render(); return; }
      S.st = r.state;
      var other = r.other ? ' ' + r.other + ' need attention: see the Activity log.' : '';
      S.flash = { kind: r.added ? 'ok' : 'warn', text: r.added + ' of ' + r.tried + ' added to the calendar.' + other };
      go('dashboard', true);
    }).catch(function (e) { toast(errText(e)); render(); });
  };
  A.upgrade = function (el, ev) { if (ev) ev.preventDefault(); S.back = S.view; S.upMsg = null; S.keyMsg = null; go('upgrade'); };
  A.upBack = function () { go(S.back || (S.st.cfg ? 'dashboard' : 'welcome')); };
  A.bill = function (el) { S.billing = el.getAttribute('data-b'); render(); };
  A.activateKey = function (el) {
    var key = (document.getElementById('licKey') || {}).value || '';
    withBusy(el, call('activateLicense', key)).then(function (r) {
      if (!r.ok) { S.keyMsg = { ok: false, text: r.msg }; render(); return; }
      S.st.plan = r.plan; S.keyMsg = null; toast('Pro is on. Thank you.');
      loadState().then(function () { go(S.back || 'dashboard'); });
    }).catch(function (e) { S.keyMsg = { ok: false, text: errText(e) }; render(); });
  };
  A.removeKey = function (el) {
    withBusy(el, call('removeLicense')).then(function () { loadState().then(function () { go('upgrade'); }); });
  };
  A.useHere = function (el) {
    withBusy(el, call('useFreeSlotHere')).then(function () { return loadState(); }).then(function () { S.upMsg = null; go(S.back || 'review'); toast('The free plan now covers this form.'); });
  };
  A.approve = function (el) {
    var id = el.getAttribute('data-id'), force = el.getAttribute('data-force') === '1';
    S.reqUi[id] = { busy: true }; render();
    call('approveRequest', id, force).then(function (r) {
      if (r.ok) { delete S.reqUi[id]; S.reqs = S.reqs.filter(function (x) { return x.id !== id; }); toast('Approved and added to the calendar.'); refreshCount(); render(); return; }
      S.reqUi[id] = { conflict: !!r.conflict, msg: r.msg }; render();
    }).catch(function (e) { S.reqUi[id] = { msg: errText(e) }; render(); });
  };
  A.decline = function (el) { S.reqUi[el.getAttribute('data-id')] = { declining: true }; render(); };
  A.cancelDecline = function (el) { delete S.reqUi[el.getAttribute('data-id')]; render(); };
  A.sendDecline = function (el) {
    var id = el.getAttribute('data-id');
    var input = app.querySelector('[data-reason="' + id.replace(/"/g, '') + '"]');
    var reason = input ? input.value : '';
    S.reqUi[id] = { declining: true, reason: reason, busy: true }; render();
    call('declineRequest', id, reason).then(function (r) {
      if (r.ok) { delete S.reqUi[id]; S.reqs = S.reqs.filter(function (x) { return x.id !== id; }); toast('Declined.'); refreshCount(); render(); return; }
      S.reqUi[id] = { declining: true, reason: reason, msg: r.msg }; render();
    }).catch(function (e) { S.reqUi[id] = { declining: true, reason: reason, msg: errText(e) }; render(); });
  };
  function refreshCount() { if (S.st) S.st.pendingCount = Math.max(0, (S.st.pendingCount || 1) - 1); }
  function scrollBottom() { var sc = app.querySelector('.scroll'); if (sc) sc.scrollTop = sc.scrollHeight; }

  // ---------------------------------------------------------------------------
  // EVENTS
  // ---------------------------------------------------------------------------
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio')) return; // handled on change
    if (el.tagName === 'INPUT') return; // checkboxes and radios act on change
    if (el.tagName === 'A' && el.getAttribute('href') === '#') ev.preventDefault();
    if (A[act]) A[act](el, ev);
  });

  app.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.hasAttribute('data-insert')) { insertToken(el); return; }
    var act = el.getAttribute('data-act');
    if (act && A[act] && (el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT')) {
      if (el.hasAttribute('data-bind')) bindValue(el);
      A[act](el, ev);
      return;
    }
    if (el.hasAttribute('data-bind')) {
      bindValue(el);
      if (el.hasAttribute('data-rerender')) render();
      if (S.view === 'step2') schedulePreview();
    }
  });

  app.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.id === 'calFilter') { S.calFilter = el.value; render(); var f = document.getElementById('calFilter'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } return; }
    if (el.hasAttribute('data-bind') && (el.tagName === 'TEXTAREA' || el.type === 'text' || el.type === 'number')) {
      bindValue(el);
      if (S.view === 'step2') schedulePreview();
    }
  });

  function bindValue(el) {
    var path = el.getAttribute('data-bind'), kind = el.getAttribute('data-kind') || 'str', v;
    if (kind === 'bool') v = el.checked;
    else if (kind === 'num') v = el.value === '' ? null : Number(el.value);
    else if (kind === 'id') v = el.value === '' ? null : Number(el.value);
    else if (kind === 'notify') v = ['owner'].concat(el.value.split(/[\s,;]+/).filter(function (x) { return /@/.test(x); }));
    else v = el.value === '' && path === 'colorId' ? null : el.value;
    setPath(S.cfg, path, v);
    if (/^pro\.routes\.\d+\.itemId$/.test(path)) setPath(S.cfg, path.replace('itemId', 'equals'), '');
  }

  function insertToken(sel) {
    var target = document.getElementById(sel.getAttribute('data-insert'));
    var name = sel.value;
    sel.value = '';
    if (!target || !name) return;
    var token = '{{' + name + '}}';
    var s = target.selectionStart != null ? target.selectionStart : target.value.length;
    var e = target.selectionEnd != null ? target.selectionEnd : target.value.length;
    target.value = target.value.slice(0, s) + token + target.value.slice(e);
    target.focus();
    target.setSelectionRange(s + token.length, s + token.length);
    bindValue(target);
    if (S.view === 'step2') schedulePreview();
  }

  // ---------------------------------------------------------------------------
  // START
  // ---------------------------------------------------------------------------
  function init() {
    loadState().then(function (st) {
      if (INITIAL === 'requests') { go('requests'); return; }
      go(st.cfg && (st.cfg.active || st.cfg.calendarId) ? 'dashboard' : 'welcome');
    }).catch(function (e) { S.loadError = errText(e); S.view = 'error'; render(); });
  }
  render();
  init();
})();
</script>
