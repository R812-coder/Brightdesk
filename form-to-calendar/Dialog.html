<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <?!= include_('Styles'); ?>
    <style>
      body { padding: 0; }
      .wrap { padding: 4px 4px 12px; }
      .top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
      .top .muted { flex: 1; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
      td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      tr:hover td { background: var(--surface); }
      .res { font-weight: 600; white-space: nowrap; }
      .res.Created, .res.Updated, .res.Approved { color: var(--accent); }
      .res.Failed { color: var(--danger); }
      .res.Conflict, .res.Declined { color: var(--warning); }
      .res.Waiting { color: var(--info); }
      .msg { color: var(--muted); font-size: 11px; margin-top: 2px; }
      .tbl { max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
      select { width: auto; min-height: 28px; padding: 2px 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="muted" id="sub">Loading</div>
        <select id="filter" aria-label="Show">
          <option value="">All results</option>
          <option value="Created">Created</option>
          <option value="Updated">Updated</option>
          <option value="Waiting for approval">Waiting for approval</option>
          <option value="Approved">Approved</option>
          <option value="Declined">Declined</option>
          <option value="Conflict">Conflict</option>
          <option value="Failed">Failed</option>
          <option value="Skipped">Skipped</option>
        </select>
        <button class="btn sm" id="refresh">Refresh</button>
      </div>
      <div class="tbl"><table>
        <thead><tr><th>Time</th><th>Respondent</th><th>Event date</th><th>Calendar</th><th>Result</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">Loading</td></tr></tbody>
      </table></div>
    </div>
    <script>
      (function () {
        var data = { rows: [], tz: '' };
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function draw() {
          var f = document.getElementById('filter').value;
          var rows = data.rows.filter(function (r) { return !f || r.result === f; });
          document.getElementById('sub').textContent = data.rows.length + ' most recent actions, times in ' + data.tz + ' (last 200 kept)';
          document.getElementById('rows').innerHTML = rows.length ? rows.map(function (r) {
            return '<tr><td>' + esc(r.time) + '</td><td>' + esc(r.who || '') + '</td><td>' + esc(r.when || '') + '</td><td>' + esc(r.cal || '') + '</td>' +
              '<td><div class="res ' + esc(String(r.result).split(' ')[0]) + '">' + esc(r.result) + '</div>' + (r.msg ? '<div class="msg">' + esc(r.msg) + '</div>' : '') + '</td>' +
              '<td>' + (r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener">Open event</a>' : '') + '</td></tr>';
          }).join('') : '<tr><td colspan="6" class="muted">Nothing here yet. Each response the add-on handles appears here.</td></tr>';
        }
        function load() {
          google.script.run.withSuccessHandler(function (d) { data = d; draw(); })
            .withFailureHandler(function (e) { document.getElementById('rows').innerHTML = '<tr><td colspan="6">' + esc(e.message || e) + '</td></tr>'; })
            .getLogRows();
        }
        document.getElementById('filter').addEventListener('change', draw);
        document.getElementById('refresh').addEventListener('click', load);
        load();
      })();
    </script>
  </body>
</html>
