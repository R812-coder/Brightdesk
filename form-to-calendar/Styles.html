<style>
  :root {
    --ink: #1F2A37; --muted: #5B6573; --line: #E3E6EA; --surface: #F7F8FA; --white: #FFFFFF;
    --accent: #15803D; --accent-hover: #166534; --accent-soft: #ECF7EF;
    --warning: #B54708; --warning-soft: #FEF6EE; --danger: #B42318; --danger-soft: #FEF3F2;
    --info: #1D4ED8; --info-soft: #EFF4FF;
    --radius: 6px; --focus: 0 0 0 3px rgba(21, 128, 61, .25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--white); }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .scroll { flex: 1; overflow-y: auto; padding: 16px 16px 24px; }
  .bar { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--white); display: flex; gap: 8px; flex-wrap: wrap; }
  .bar .btn { flex: 1; }
  .foot { padding: 8px 16px 12px; color: var(--muted); font-size: 12px; display: flex; gap: 6px; justify-content: center; }
  .foot a { color: var(--muted); }
  h1 { font-size: 18px; line-height: 1.3; margin: 4px 0 16px; font-weight: 650; }
  h2 { font-size: 15px; margin: 0 0 4px; font-weight: 650; }
  h3 { font-size: 13px; margin: 0 0 4px; font-weight: 650; }
  p { margin: 0 0 8px; }
  a { color: var(--info); }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .steps { margin: 0 0 20px; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; position: relative; padding: 0 0 12px 32px; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; }

  .field { margin-bottom: 16px; }
  .label { display: flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
  input[type=text], input[type=number], input[type=email], input[type=time], select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--white); border: 1px solid #CDD2D8; border-radius: var(--radius); padding: 7px 8px; min-height: 32px;
  }
  textarea { min-height: 72px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible, .radio:focus-within { outline: none; box-shadow: var(--focus); border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; min-width: 0; }
  .row .shrink { flex: 0 0 auto; }
  .ins { margin-top: 4px; width: auto; min-height: 26px; padding: 2px 6px; font-size: 12px; color: var(--muted); }

  .btn { font: inherit; font-weight: 600; border-radius: var(--radius); padding: 8px 12px; min-height: 34px; cursor: pointer; border: 1px solid #CDD2D8; background: var(--white); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .btn:hover { background: var(--surface); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--danger); }
  .btn.link { border: none; background: none; color: var(--info); padding: 0; min-height: 0; font-weight: 500; }
  .btn.sm { min-height: 28px; padding: 4px 10px; font-size: 12px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .btn svg { width: 16px; height: 16px; flex: 0 0 16px; }

  .card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--white); margin-bottom: 12px; }
  .card.soft { background: var(--surface); }
  .preview { border-left: 3px solid var(--accent); background: var(--surface); }
  .preview .t { font-weight: 650; margin-bottom: 2px; }
  .notice { border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 12px; display: flex; gap: 8px; align-items: flex-start; }
  .notice svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 1px; }
  .notice.warn { background: var(--warning-soft); color: var(--warning); }
  .notice.err { background: var(--danger-soft); color: var(--danger); }
  .notice.info { background: var(--info-soft); color: var(--info); }
  .notice.ok { background: var(--accent-soft); color: var(--accent); }
  .notice .body { flex: 1; color: var(--ink); }
  .notice .body b { color: inherit; }

  .radio { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 6px; cursor: pointer; }
  .radio.on { border-color: var(--accent); background: var(--accent-soft); }
  .radio input { margin: 2px 0 0; accent-color: var(--accent); }
  .radio .tz { color: var(--muted); font-size: 12px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
  .pill.on { background: var(--accent-soft); color: var(--accent); }
  .pill.off { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
  .pill.paused { background: var(--warning-soft); color: var(--warning); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pro { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; line-height: 15px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; }
  .badge.warn { background: var(--warning-soft); color: var(--warning); }

  .opt { border-top: 1px solid var(--line); padding: 12px 0; }
  .opt:first-child { border-top: none; }
  .opt .head { display: flex; gap: 10px; align-items: flex-start; }
  .opt .head .txt { flex: 1; }
  .opt .sub { margin: 10px 0 0 0; padding: 10px; background: var(--surface); border-radius: var(--radius); }
  .switch { position: relative; width: 34px; height: 20px; flex: 0 0 34px; margin-top: 1px; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: #CDD2D8; border-radius: 999px; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .switch input:focus-visible + span { box-shadow: var(--focus); }
  .check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .check input { margin: 2px 0 0; accent-color: var(--accent); }
  .days { display: flex; gap: 4px; flex-wrap: wrap; }
  .days label { border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font-size: 12px; cursor: pointer; display: flex; gap: 4px; align-items: center; }
  .days input { accent-color: var(--accent); margin: 0; }
  .rule { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; margin-bottom: 8px; background: var(--white); }

  .stat { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .stat svg { width: 16px; height: 16px; flex: 0 0 16px; color: var(--muted); }
  .bar.stack .btn { flex-basis: 100%; }
  .kv { display: grid; grid-template-columns: 88px 1fr; gap: 2px 8px; font-size: 12px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .list { margin: 6px 0 0; padding-left: 18px; }
  .center { text-align: center; padding: 40px 0; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 76px; background: var(--ink); color: #fff; border-radius: var(--radius); padding: 10px 12px; font-size: 12px; z-index: 5; }
  .seg { display: inline-flex; border: 1px solid #CDD2D8; border-radius: var(--radius); overflow: hidden; }
  .seg button { font: inherit; font-size: 12px; border: none; background: var(--white); padding: 5px 12px; cursor: pointer; color: var(--ink); }
  .seg button.on { background: var(--accent); color: #fff; }
  .price { font-size: 22px; font-weight: 700; }
  .ticks { list-style: none; padding: 0; margin: 8px 0; }
  .ticks li { display: flex; gap: 8px; padding: 3px 0; }
  .ticks svg { width: 16px; height: 16px; flex: 0 0 16px; color: var(--accent); margin-top: 2px; }
  hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
</style>
